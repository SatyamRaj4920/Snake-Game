<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0015;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      color: #fff;
    }

    h1 {
      font-family: 'Bungee', cursive;
      font-size: 2.5rem;
      background: linear-gradient(135deg, #ff2d78, #ffe600, #00f5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      padding: 8px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .hud-label {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 2px;
    }

    .hud-value {
      font-family: 'Bungee', cursive;
      font-size: 1.4rem;
      color: #ffe600;
    }

    .hud-value.cyan { color: #00f5ff; }

    .speed-bar { display: flex; gap: 3px; margin-top: 4px; }
    .speed-seg {
      width: 12px; height: 5px;
      border-radius: 2px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      transition: background 0.3s;
    }
    .speed-seg.lit { background: #39ff14; box-shadow: 0 0 5px #39ff14; }
    .speed-seg:nth-child(2).lit { background: #00f5ff; box-shadow: 0 0 5px #00f5ff; }
    .speed-seg:nth-child(3).lit { background: #ffe600; box-shadow: 0 0 5px #ffe600; }
    .speed-seg:nth-child(4).lit { background: #ff7700; box-shadow: 0 0 5px #ff7700; }
    .speed-seg:nth-child(5).lit { background: #ff2d78; box-shadow: 0 0 5px #ff2d78; }

    .canvas-wrap {
      position: relative;
      padding: 3px;
      background: linear-gradient(135deg, #ff2d78, #00f5ff, #ffe600);
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(255,45,120,0.4);
    }

    canvas {
      display: block;
      border-radius: 4px;
      background: #07000f;
    }

    .overlay {
      position: absolute;
      inset: 3px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(7,0,15,0.92);
    }

    .overlay.hidden { display: none; }

    .overlay-title {
      font-family: 'Bungee', cursive;
      font-size: 2rem;
      letter-spacing: 0.2em;
      color: #00f5ff;
    }

    .overlay-title.danger { color: #ff2d78; }

    .overlay-info {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-align: center;
      line-height: 2;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
    }

    .overlay-info span {
      font-family: 'Bungee', cursive;
      font-size: 1.1rem;
      color: #ffe600;
    }

    .btn {
      font-family: 'Bungee', cursive;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      padding: 10px 32px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: linear-gradient(135deg, #ff2d78, #bf00ff);
      color: #fff;
      box-shadow: 0 0 16px rgba(255,45,120,0.5);
      transition: transform 0.15s, box-shadow 0.2s;
    }

    .btn:hover { transform: scale(1.05); box-shadow: 0 0 28px rgba(255,45,120,0.7); }
    .btn:active { transform: scale(0.97); }

    .controls-hint {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      text-align: center;
      line-height: 2;
    }

    .controls-hint kbd {
      padding: 1px 5px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 3px;
      font-size: 0.6rem;
      background: rgba(255,255,255,0.05);
      color: #00f5ff;
    }

    .score-popup {
      position: absolute;
      font-family: 'Bungee', cursive;
      font-size: 1rem;
      color: #ffe600;
      text-shadow: 0 0 8px #ffe600;
      pointer-events: none;
      z-index: 20;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-40px); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>SNAKE</h1>

  <div class="hud">
    <div>
      <div class="hud-label">Score</div>
      <div class="hud-value" id="score">000</div>
    </div>
    <div style="text-align:center">
      <div class="hud-label">Speed</div>
      <div class="speed-bar">
        <div class="speed-seg" id="seg-1"></div>
        <div class="speed-seg" id="seg-2"></div>
        <div class="speed-seg" id="seg-3"></div>
        <div class="speed-seg" id="seg-4"></div>
        <div class="speed-seg" id="seg-5"></div>
      </div>
    </div>
    <div style="text-align:right">
      <div class="hud-label">Best</div>
      <div class="hud-value cyan" id="best">000</div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvas-wrap">
    <canvas id="c"></canvas>

    <div class="overlay" id="start-screen">
      <div class="overlay-title">READY?</div>
      <div class="overlay-info">Arrow keys or WASD to steer<br>Eat food → grow → go faster</div>
      <button class="btn" id="start-btn">START GAME</button>
      <div class="controls-hint">
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
      </div>
    </div>

    <div class="overlay hidden" id="gameover-screen">
      <div class="overlay-title danger">GAME OVER</div>
      <div class="overlay-info" id="final-text"></div>
      <button class="btn" id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const COLS = 25, ROWS = 25;
    const CELL = Math.min(Math.floor(Math.min(window.innerWidth * 0.9, window.innerHeight * 0.58) / COLS), 20);
    const BASE_SPEED = 155;

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    canvas.width  = COLS * CELL;
    canvas.height = ROWS * CELL;

    const scoreEl     = document.getElementById('score');
    const bestEl      = document.getElementById('best');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const finalText   = document.getElementById('final-text');
    const canvasWrap  = document.getElementById('canvas-wrap');

    const FOOD_COLORS = ['#ff2d78','#00f5ff','#ffe600','#bf00ff','#39ff14','#ff7700'];
    const SNAKE_COLORS = ['#ff2d78','#ff5a2d','#ffae00','#ffe600','#39ff14','#00f5ff','#bf00ff'];

    let snake, dir, nextDir, food, score, best = 0;
    let running = false, animId, lastTime = 0, acc = 0, interval = BASE_SPEED;

    const fmt = n => String(n).padStart(3, '0');

    // --- Game Logic ---

    function init() {
      const mid = Math.floor(COLS / 2);
      snake = [
        { x: mid,   y: Math.floor(ROWS / 2) },
        { x: mid-1, y: Math.floor(ROWS / 2) },
        { x: mid-2, y: Math.floor(ROWS / 2) },
      ];
      dir = nextDir = { x: 1, y: 0 };
      score = 0;
      interval = BASE_SPEED;
      scoreEl.textContent = fmt(0);
      updateSpeedBar(3);
      placeFood();
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = { ...pos, t: 0, color: FOOD_COLORS[Math.floor(Math.random() * FOOD_COLORS.length)] };
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // wall or self collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { endGame(); return; }
      if (snake.some(s => s.x === head.x && s.y === head.y))             { endGame(); return; }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = fmt(score);
        if (score > best) { best = score; bestEl.textContent = fmt(best); }
        interval = Math.max(55, BASE_SPEED - (getSpeedLevel(snake.length) - 1) * 22);
        updateSpeedBar(snake.length);
        showPopup(food.x, food.y);
        placeFood();
      } else {
        snake.pop();
      }
    }

    function getSpeedLevel(len) {
      if (len < 5)  return 1;
      if (len < 10) return 2;
      if (len < 18) return 3;
      if (len < 28) return 4;
      return 5;
    }

    function updateSpeedBar(len) {
      const level = getSpeedLevel(len);
      for (let i = 1; i <= 5; i++)
        document.getElementById(`seg-${i}`).classList.toggle('lit', i <= level);
    }

    function showPopup(gx, gy) {
      const el = document.createElement('div');
      el.className = 'score-popup';
      el.textContent = '+10';
      el.style.left = (gx * CELL + CELL / 2 + 3) + 'px';
      el.style.top  = (gy * CELL + 3) + 'px';
      canvasWrap.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    // --- Drawing ---

    function draw() {
      // background + grid dots
      ctx.fillStyle = '#07000f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#120020';
      for (let x = 0; x < COLS; x++)
        for (let y = 0; y < ROWS; y++) {
          ctx.beginPath();
          ctx.arc(x*CELL + CELL/2, y*CELL + CELL/2, 1, 0, Math.PI*2);
          ctx.fill();
        }

      drawFood();
      drawSnake();
    }

    function drawFood() {
      food.t += 0.06;
      const fx = food.x * CELL + CELL/2;
      const fy = food.y * CELL + CELL/2;
      const r  = (CELL/2 - 2) * (Math.sin(food.t) * 0.3 + 0.9);

      ctx.save();
      ctx.shadowColor = food.color;
      ctx.shadowBlur = 18;
      const g = ctx.createRadialGradient(fx - r*0.3, fy - r*0.3, 0, fx, fy, r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.4, food.color);
      g.addColorStop(1, food.color + '44');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(fx, fy, r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    function drawSnake() {
      const total = snake.length;
      for (let i = total - 1; i >= 0; i--) {
        const seg = snake[i];
        const t   = 1 - i / total;
        const col = getSnakeColor(i, total);
        const pad = i === 0 ? 1 : 2;
        const x   = seg.x * CELL + pad;
        const y   = seg.y * CELL + pad;
        const sz  = CELL - pad * 2;

        ctx.save();
        ctx.shadowColor = col;
        ctx.shadowBlur  = i === 0 ? 18 : 6;
        if (i !== 0) ctx.globalAlpha = 0.4 + t * 0.6;
        const g = ctx.createLinearGradient(x, y, x+sz, y+sz);
        g.addColorStop(0, col);
        g.addColorStop(1, col + '88');
        ctx.fillStyle = g;
        roundRect(x, y, sz, sz, i === 0 ? 4 : 3);
        ctx.fill();
        ctx.restore();
      }

      // eyes on the head
      drawEyes(snake[0]);
    }

    function getSnakeColor(i, total) {
      const t = i / Math.max(total - 1, 1);
      const max = SNAKE_COLORS.length - 1;
      const idx = t * max;
      const lo  = Math.floor(idx);
      return lerpColor(SNAKE_COLORS[lo], SNAKE_COLORS[Math.min(lo+1, max)], idx - lo);
    }

    function drawEyes(head) {
      const cx = head.x * CELL + CELL/2;
      const cy = head.y * CELL + CELL/2;
      const r  = CELL * 0.115;
      const o  = CELL * 0.22;
      let e1, e2;
      if      (dir.x ===  1) { e1={x:cx+o*0.5,y:cy-o}; e2={x:cx+o*0.5,y:cy+o}; }
      else if (dir.x === -1) { e1={x:cx-o*0.5,y:cy-o}; e2={x:cx-o*0.5,y:cy+o}; }
      else if (dir.y === -1) { e1={x:cx-o,y:cy-o*0.5}; e2={x:cx+o,y:cy-o*0.5}; }
      else                   { e1={x:cx-o,y:cy+o*0.5}; e2={x:cx+o,y:cy+o*0.5}; }

      [e1, e2].forEach(e => {
        ctx.fillStyle = '#0a0010';
        ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(e.x + r*0.25, e.y - r*0.25, r*0.45, 0, Math.PI*2); ctx.fill();
      });
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y,   x+w, y+r);
      ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x,   y+h, x,   y+h-r);
      ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x,   y,   x+r, y);
      ctx.closePath();
    }

    // --- Color helpers ---

    function lerpColor(c1, c2, t) {
      const a = hexRgb(c1), b = hexRgb(c2);
      const r = Math.round(a.r + (b.r - a.r) * t);
      const g = Math.round(a.g + (b.g - a.g) * t);
      const bv= Math.round(a.b + (b.b - a.b) * t);
      return '#' + [r, g, bv].map(v => v.toString(16).padStart(2,'0')).join('');
    }

    function hexRgb(hex) {
      return {
        r: parseInt(hex.slice(1,3), 16),
        g: parseInt(hex.slice(3,5), 16),
        b: parseInt(hex.slice(5,7), 16)
      };
    }

    // --- Game loop ---

    function loop(ts) {
      animId = requestAnimationFrame(loop);
      const delta = Math.min(ts - lastTime, 100);
      lastTime = ts;
      acc += delta;
      if (acc >= interval) { acc = 0; step(); }
      draw();
    }

    function startGame() {
      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
      init();
      running = true;
      lastTime = performance.now();
      acc = 0;
      animId = requestAnimationFrame(loop);
    }

    function endGame() {
      running = false;
      cancelAnimationFrame(animId);
      finalText.innerHTML = `SCORE &nbsp;<span>${fmt(score)}</span><br>BEST &nbsp;&nbsp;<span>${fmt(best)}</span>`;
      gameoverScreen.classList.remove('hidden');
    }

    // --- Input ---

    const KEYS = {
      ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
      w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
      W:{x:0,y:-1}, S:{x:0,y:1}, A:{x:-1,y:0}, D:{x:1,y:0},
    };

    document.addEventListener('keydown', e => {
      const nd = KEYS[e.key];
      if (!nd) return;
      if (e.key.startsWith('Arrow')) e.preventDefault();
      if (!running) return;
      if (nd.x === -dir.x && nd.y === -dir.y) return; // no 180 turns
      nextDir = nd;
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    // draw empty board before game starts
    draw();
  </script>
</body>
</html>
